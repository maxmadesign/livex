<title>LiveX AI City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* Layout: a screening-room treatment — one reading column, film-wide media, and a
   60-second timeline strip as the spine of the page. Deliberately dark (the film's world). */
:root {
  --ink: #07090c;          /* page ground = the film's black */
  --panel: #0f1318;        /* raised surfaces */
  --line: #232a33;         /* hairlines */
  --fg: #e9edf2;           /* body text */
  --dim: #8d96a3;          /* secondary text */
  --cobalt: #3f6bff;       /* LiveX blue: Lyra, links, the live dot */
  --warm: #ffcf9a;         /* time: timecodes, the clock */
  --sans: 'Geist', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --serif: 'Instrument Serif', 'Songti SC', Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--ink); }
body { margin: 0; background: var(--ink); color: var(--fg); font: 400 16px/1.7 var(--sans); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 120px; }
.read { max-width: 720px; }
a { color: var(--cobalt); }
h1, h2, h3 { font-weight: 500; letter-spacing: -0.025em; text-wrap: balance; margin: 0; }
h2 { font-size: clamp(28px, 4vw, 44px); line-height: 1.08; }
h3 { font-size: 20px; letter-spacing: -0.01em; }
p { margin: 0; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--dim); display: flex; gap: 14px; align-items: center; }
.eyebrow::before { content: ""; width: 40px; height: 1px; background: var(--dim); }
.tc { font-family: var(--mono); color: var(--warm); font-variant-numeric: tabular-nums; }
section { padding-block: 72px 0; display: grid; gap: 28px; }
.lede { font: 400 clamp(18px, 2.1vw, 23px)/1.75 'Noto Serif SC', 'Songti SC', serif; color: #fff; max-width: 820px; }

/* hero */
.hero { display: grid; gap: 22px; padding-top: 12px; }
.hero h1 { font-size: clamp(48px, 9vw, 120px); line-height: .92; letter-spacing: -0.05em; }
.hero h1 em { font: italic 400 1em var(--serif); letter-spacing: -0.02em; color: #fff; }
.film { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); }
.film video { width: 100%; height: 100%; display: block; }
.meta { display: flex; flex-wrap: wrap; gap: 10px 28px; font: 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.meta b { color: var(--fg); font-weight: 500; }

/* scale ladder */
.ladder { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ladder div { padding: 16px 12px; border-left: 1px solid var(--line); font: 500 12px var(--mono); letter-spacing: .14em; }
.ladder div:first-child { border-left: 0; }
.ladder small { display: block; color: var(--dim); font: 400 13px/1.4 var(--sans); letter-spacing: 0; margin-top: 8px; }
@media (max-width: 720px) { .ladder { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ladder div:nth-child(odd) { border-left: 0; } .ladder div { border-bottom: 1px solid var(--line); } }

/* concepts */
.concepts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.concept { background: var(--ink); padding: 24px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.concept.win { background: var(--panel); }
.concept .tag { font: 500 11px var(--mono); letter-spacing: .16em; color: var(--dim); text-transform: uppercase; }
.concept.win .tag { color: var(--cobalt); }
.concept h3 { font-size: 26px; }
.concept .zh { font-size: 15px; color: var(--dim); }
.concept dl { margin: 0; display: grid; gap: 10px; font-size: 14px; line-height: 1.6; }
.concept dt { font: 500 11px var(--mono); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.concept dd { margin: 0; }
@media (max-width: 900px) { .concepts { grid-template-columns: minmax(0, 1fr); } }

/* timeline strip */
.strip-scroll { overflow-x: auto; border: 1px solid var(--line); }
.strip { position: relative; min-width: 960px; height: 208px; background: var(--panel); }
.strip .sec { position: absolute; top: 0; height: 28px; border-left: 1px solid var(--line); font: 500 10.5px/28px var(--mono); letter-spacing: .14em; padding-left: 8px; color: var(--dim); white-space: nowrap; overflow: hidden; }
.strip .shot { position: absolute; top: 36px; height: 140px; border-left: 1px solid rgba(255,255,255,.25); overflow: hidden; background-size: cover; background-position: center; }
.strip .shot span { position: absolute; left: 4px; bottom: 4px; font: 500 10px var(--mono); color: #fff; text-shadow: 0 1px 4px #000; }
.strip .ticks { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; border-top: 1px solid var(--line); }
.strip .ticks i { position: absolute; bottom: 0; height: 6px; border-left: 1px solid var(--dim); font: 10px/1 var(--mono); color: var(--dim); font-style: normal; }
.strip .ticks i b { position: absolute; bottom: 9px; left: 3px; font-weight: 400; }

/* shot list */
.shots { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.shotrow { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; background: var(--ink); padding: 18px; }
.shotrow img { width: 100%; max-width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; border: 1px solid var(--line); }
.shotrow h3 { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.shotrow .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 22px; margin-top: 10px; font-size: 14px; line-height: 1.55; }
.shotrow .facts div { min-width: 0; }
.shotrow .facts b { display: block; font: 500 10.5px var(--mono); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; margin-bottom: 2px; }
@media (max-width: 760px) { .shotrow { grid-template-columns: minmax(0, 1fr); } .shotrow .facts { grid-template-columns: minmax(0, 1fr); } }

/* prompt blocks */
details.prompt { border: 1px solid var(--line); background: var(--panel); }
details.prompt summary { cursor: pointer; padding: 14px 18px; display: flex; gap: 14px; align-items: baseline; list-style: none; }
details.prompt summary::-webkit-details-marker { display: none; }
details.prompt summary::before { content: "+"; font: 500 14px var(--mono); color: var(--dim); width: 14px; }
details.prompt[open] summary::before { content: "–"; }
details.prompt summary:focus-visible { outline: 2px solid var(--cobalt); outline-offset: -2px; }
.prompt .body { padding: 0 18px 18px; display: grid; gap: 10px; }
.prompt pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13.5px/1.65 var(--mono); color: #cfd6df; background: var(--ink); border: 1px solid var(--line); padding: 16px; max-height: 520px; overflow: auto; }
.copy { justify-self: start; font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg); background: transparent; border: 1px solid var(--line); padding: 8px 14px; cursor: pointer; }
.copy:hover { border-color: var(--cobalt); }
.copy:focus-visible { outline: 2px solid var(--cobalt); }

/* system */
.system { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.card { border: 1px solid var(--line); padding: 20px; background: var(--panel); min-width: 0; display: grid; gap: 12px; align-content: start; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { width: 86px; font: 10.5px/1.3 var(--mono); color: var(--dim); }
.sw i { display: block; height: 44px; border: 1px solid var(--line); margin-bottom: 6px; }
.curves { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
.curves figure { margin: 0; font: 10.5px var(--mono); color: var(--dim); }
.curves svg { width: 100%; height: auto; display: block; background: var(--ink); border: 1px solid var(--line); }
.stills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stills img { width: 100%; max-width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; border: 1px solid var(--line); }
@media (max-width: 760px) { .system { grid-template-columns: minmax(0, 1fr); } .stills { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* music form */
.form { display: grid; grid-template-columns: repeat(60, minmax(0, 1fr)); height: 64px; border: 1px solid var(--line); }
.form div { border-left: 1px solid var(--line); padding: 8px; font: 500 10.5px var(--mono); letter-spacing: .1em; overflow: hidden; white-space: nowrap; }
.md { font-size: 15px; line-height: 1.75; color: var(--fg); }
.md table { border-collapse: collapse; font-size: 13.5px; width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
.md th { font: 500 11px var(--mono); letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }
.md h1, .md h2, .md h3, .md h4 { margin: 28px 0 10px; }
.md h1 { font-size: 28px; } .md h2 { font-size: 24px; } .md h3 { font-size: 19px; } .md h4 { font-size: 16px; }
.md p, .md ul, .md ol { margin: 0 0 12px; }
.md code { font: 13px var(--mono); background: var(--panel); padding: 1px 5px; }
.md pre { white-space: pre-wrap; font: 13px/1.6 var(--mono); background: var(--panel); border: 1px solid var(--line); padding: 14px; overflow-x: auto; }
.md blockquote { margin: 0 0 12px; padding-left: 14px; border-left: 2px solid var(--cobalt); color: var(--dim); }
.tablewrap { overflow-x: auto; }
.note { font-size: 14px; color: var(--dim); }
footer { margin-top: 96px; padding-top: 24px; border-top: 1px solid var(--line); font: 12px var(--mono); letter-spacing: .08em; color: var(--dim); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
