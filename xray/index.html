<!doctype html>
<html lang="zh-CN" data-profile="p32">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>X-Ray Mirror</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: the camera picture fills the whole screen like a mirror; everything else floats over it.
   Sizes are written in design pixels of a 1080-wide portrait canvas (--u), times the screen's UI scale (--k). */
:root {
  --ink: #06080b; --graphite: #0f1216; --steel: #8a919c; --mist: #d9dee5; --paper: #f4f5f7; --cobalt: #2f5bea;
  --glass: rgba(9, 12, 17, 0.66); --hair: rgba(217, 222, 229, 0.18); --warn: #ffb468;
  --sans: "Geist", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, Consolas, "Noto Sans SC", monospace;
  --u: calc(min(100vw, 100vh * 0.5625) / 1080);
  --k: 1;
  --base: 58;       /* 86-inch screen: height of the UI's centre line, in % of the screen, from the bottom */
  --span: 50;       /* 86-inch screen: height of the band the UI may use, in % of the screen */
  --p: calc(var(--u) * var(--k));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--paper);
             font-family: var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; }
[hidden] { display: none !important; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: calc(3 * var(--p)) solid var(--cobalt); outline-offset: calc(3 * var(--p)); }

/* ---------- the mirror ---------- */
#stage { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 38%, #10182a, #05070c 78%); }
#stage video, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#video, #cam { object-fit: cover; }
#shade, #gl, #hud { pointer-events: none; }
.mirror #video, .mirror #cam, .mirror #shade, .mirror #gl { transform: scaleX(-1); }

/* ---------- floating UI: 32-inch portrait and desktop ---------- */
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.status { position: absolute; left: calc(56 * var(--p)); top: calc(40 * var(--p)); display: flex; align-items: center; gap: calc(14 * var(--p));
          height: calc(72 * var(--p)); padding: 0 calc(28 * var(--p)); border-radius: calc(36 * var(--p));
          background: var(--glass); border: 1px solid var(--hair); backdrop-filter: blur(calc(18 * var(--p))); -webkit-backdrop-filter: blur(calc(18 * var(--p)));
          font: 500 calc(21 * var(--p))/1.2 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--mist); pointer-events: none; }
.status .brand { color: var(--paper); }
.status .sep { width: calc(34 * var(--p)); height: 1px; background: var(--steel); }
.status .dot { width: calc(12 * var(--p)); height: calc(12 * var(--p)); border-radius: 50%; background: var(--steel); }
.status.live .dot { background: var(--cobalt); box-shadow: 0 0 calc(14 * var(--p)) var(--cobalt); animation: breathe 4.2s ease-in-out infinite; }
.status.warn .dot { background: var(--warn); }
@keyframes breathe { 50% { opacity: 0.45; } }
#state { text-transform: none; letter-spacing: 0.04em; color: var(--mist); }

.chips { position: absolute; left: 50%; bottom: calc(76 * var(--p)); transform: translateX(-50%);
         display: flex; gap: calc(16 * var(--p)); padding: calc(14 * var(--p)); border-radius: calc(70 * var(--p));
         background: var(--glass); border: 1px solid var(--hair); backdrop-filter: blur(calc(18 * var(--p))); -webkit-backdrop-filter: blur(calc(18 * var(--p))); }
.chips button { min-width: calc(168 * var(--p)); height: calc(96 * var(--p)); padding: 0 calc(30 * var(--p)); border-radius: calc(48 * var(--p));
                border: 1px solid transparent; background: transparent; color: var(--mist); cursor: pointer;
                font-size: calc(30 * var(--p)); font-weight: 500; letter-spacing: 0.01em; white-space: nowrap; transition: background .25s, color .25s; }
.chips button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
.chips button:active { transform: scale(0.97); }
#gear { position: absolute; right: calc(56 * var(--p)); top: calc(40 * var(--p)); width: calc(72 * var(--p)); height: calc(72 * var(--p)); border-radius: 50%;
        background: var(--glass); border: 1px solid var(--hair); cursor: pointer; display: grid; place-items: center; opacity: 0.55; }
#gear svg { width: 46%; height: 46%; }
#hint { position: absolute; left: 50%; bottom: calc(236 * var(--p)); transform: translateX(-50%); margin: 0; max-width: 86vw; text-align: center;
        padding: calc(18 * var(--p)) calc(36 * var(--p)); border-radius: calc(44 * var(--p)); background: var(--glass); border: 1px solid var(--hair);
        backdrop-filter: blur(calc(18 * var(--p))); -webkit-backdrop-filter: blur(calc(18 * var(--p)));
        font-size: calc(32 * var(--p)); font-weight: 500; letter-spacing: 0.01em; pointer-events: none; }

.card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(calc(820 * var(--p)), 88vw); text-align: center;
        display: flex; flex-direction: column; align-items: center; gap: calc(30 * var(--p)); }
.card h1 { margin: 0; font-size: calc(92 * var(--p)); font-weight: 500; letter-spacing: -0.035em; line-height: 1.05; }
.card p { margin: 0; font-size: calc(30 * var(--p)); line-height: 1.5; color: var(--mist); }
.card .go { height: calc(104 * var(--p)); padding: 0 calc(64 * var(--p)); border-radius: calc(52 * var(--p)); border: 0; cursor: pointer;
            background: var(--cobalt); color: #fff; font-size: calc(32 * var(--p)); font-weight: 600; }
.card .go:disabled { opacity: 0.55; }
.card .fine { font: 400 calc(19 * var(--p))/1.5 var(--mono); color: var(--steel); letter-spacing: 0.02em; }

/* ---------- settings ---------- */
#sheet { position: absolute; right: calc(40 * var(--p)); top: calc(130 * var(--p)); bottom: calc(210 * var(--p)); width: min(calc(600 * var(--p)), 92vw);
         background: rgba(9, 12, 17, 0.9); border: 1px solid var(--hair); border-radius: calc(28 * var(--p)); backdrop-filter: blur(calc(22 * var(--p)));
         -webkit-backdrop-filter: blur(calc(22 * var(--p))); overflow-y: auto; padding: calc(30 * var(--p)); font-size: calc(24 * var(--p)); }
#sheet h2 { margin: calc(26 * var(--p)) 0 calc(12 * var(--p)); font: 500 calc(18 * var(--p))/1.2 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--steel); }
#sheet h2:first-child { margin-top: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: calc(18 * var(--p)); min-height: calc(62 * var(--p)); }
.row label { flex: 1 1 auto; min-width: 0; }
.row input[type=range] { flex: 0 0 46%; accent-color: var(--cobalt); height: calc(40 * var(--p)); }
.row select { flex: 0 0 52%; max-width: 52%; height: calc(56 * var(--p)); padding: 0 calc(12 * var(--p)); border-radius: calc(12 * var(--p)); background: var(--graphite); border: 1px solid var(--hair); }
.row input[type=checkbox] { width: calc(34 * var(--p)); height: calc(34 * var(--p)); accent-color: var(--cobalt); }
.row button { height: calc(56 * var(--p)); padding: 0 calc(22 * var(--p)); border-radius: calc(12 * var(--p)); background: var(--graphite); border: 1px solid var(--hair); cursor: pointer; }
#sheet small, #sheet .note { display: block; margin-top: calc(10 * var(--p)); font-size: calc(19 * var(--p)); line-height: 1.5; color: var(--steel); }
#debug { margin: calc(12 * var(--p)) 0 0; padding: calc(14 * var(--p)); border-radius: calc(12 * var(--p)); background: var(--graphite);
         font: 400 calc(17 * var(--p))/1.55 var(--mono); white-space: pre-wrap; color: var(--mist); }

/* ---------- 86-inch portrait: everything a visitor reads or touches sits in a band around the centre line ---------- */
[data-profile="p86"] { --k: 0.62; }
[data-profile="p86"] .status { top: auto; left: calc(56 * var(--p)); bottom: calc(var(--base) * 1%); transform: translateY(50%);
                               flex-direction: column; align-items: flex-start; gap: calc(12 * var(--p)); max-width: 24vw;
                               height: auto; padding: calc(26 * var(--p)) calc(28 * var(--p)); border-radius: calc(28 * var(--p)); }
[data-profile="p86"] .status .sep { width: calc(56 * var(--p)); }
[data-profile="p86"] #state { white-space: normal; line-height: 1.4; }
[data-profile="p86"] .chips { left: auto; right: calc(56 * var(--p)); bottom: calc(var(--base) * 1%); transform: translateY(50%); flex-direction: column; }
[data-profile="p86"] .chips button { min-width: calc(210 * var(--p)); }
[data-profile="p86"] #gear { top: auto; right: calc(56 * var(--p)); bottom: calc((var(--base) - var(--span) / 2) * 1%); }
[data-profile="p86"] #hint { bottom: calc((var(--base) - var(--span) / 2 + 3) * 1%); }
[data-profile="p86"] .card { top: auto; bottom: calc(var(--base) * 1%); transform: translate(-50%, 50%); }
[data-profile="p86"] #sheet { top: auto; bottom: calc(var(--base) * 1%); transform: translateY(50%); height: calc(var(--span) * 1%); right: calc(300 * var(--p)); }

/* ---------- landscape desktop ---------- */
[data-profile="desk"] { --u: calc(min(100vw, 100vh * 1.6) / 1900); }
@media (prefers-reduced-motion: reduce) { .status.live .dot { animation: none; } .chips button { transition: none; } }
</style>
</head>
<body class="mirror">
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="cam" hidden></canvas>
  <canvas id="shade"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
</div>

<div id="ui">
  <div class="status" id="status"><span class="brand">LiveX</span><span class="sep"></span><span data-t="name">X-Ray Mirror</span><span class="dot"></span><span id="state"></span></div>

  <nav class="chips" id="chips" hidden>
    <button data-layer="skeleton" aria-pressed="true" data-t="skeleton"></button>
    <button data-layer="brain" aria-pressed="false" data-t="brain"></button>
    <button data-layer="muscles" aria-pressed="false" data-t="muscles"></button>
    <button data-layer="lens" aria-pressed="false" data-t="lens"></button>
  </nav>
  <p id="hint" hidden></p>

  <section class="card" id="start">
    <h1 data-t="title"></h1>
    <p data-t="intro"></p>
    <button class="go" id="go" data-t="start"></button>
    <p class="fine" data-t="privacy"></p>
  </section>

  <button id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg></button>

  <aside id="sheet" hidden>
    <h2 data-t="s_screen"></h2>
    <div class="row"><label for="profile" data-t="s_profile"></label><select id="profile"><option value="auto" data-t="o_auto"></option><option value="p32" data-t="o_p32"></option><option value="p86" data-t="o_p86"></option><option value="desk" data-t="o_desk"></option></select></div>
    <div class="row"><label for="uiBase"><span data-t="s_base"></span> <b id="uiBaseV"></b></label><input id="uiBase" type="range" min="35" max="75" step="1"></div>
    <div class="row"><label for="lang" data-t="s_lang"></label><select id="lang"><option value="zh">中文</option><option value="en">English</option></select></div>
    <div class="row"><label data-t="s_full"></label><button id="full" data-t="b_full"></button></div>

    <h2 data-t="s_camera"></h2>
    <div class="row"><label for="camera" data-t="s_device"></label><select id="camera"></select></div>
    <div class="row"><label for="rotate" data-t="s_rotate"></label><select id="rotate"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></div>
    <div class="row"><label for="mirror" data-t="s_mirror"></label><input id="mirror" type="checkbox"></div>

    <h2 data-t="s_picture"></h2>
    <div class="row"><label for="look" data-t="s_look"></label><select id="look"><option value="xray" data-t="o_xray"></option><option value="solid" data-t="o_solid"></option></select></div>
    <div class="row"><label for="bright" data-t="s_bright"></label><input id="bright" type="range" min="0.4" max="2" step="0.01"></div>
    <div class="row"><label for="real" data-t="s_real"></label><input id="real" type="range" min="0" max="1" step="0.01"></div>
    <div class="row"><label for="lensSize" data-t="s_lens"></label><input id="lensSize" type="range" min="0.15" max="1" step="0.01"></div>

    <h2 data-t="s_fit"></h2>
    <div class="row"><label for="fitSize" data-t="s_fsize"></label><input id="fitSize" type="range" min="0.8" max="1.3" step="0.005"></div>
    <div class="row"><label for="fitY" data-t="s_fy"></label><input id="fitY" type="range" min="-4" max="4" step="0.1"></div>
    <div class="row"><label for="fitZ" data-t="s_fz"></label><input id="fitZ" type="range" min="-4" max="4" step="0.1"></div>

    <h2 data-t="s_perf"></h2>
    <div class="row"><label for="perf" data-t="s_mode"></label><select id="perf"><option value="auto" data-t="o_pauto"></option><option value="quality" data-t="o_quality"></option><option value="balanced" data-t="o_balanced"></option><option value="fast" data-t="o_fast"></option></select></div>
    <div class="row"><label for="body" data-t="s_body"></label><select id="body"><option value="lite" data-t="o_lite"></option><option value="full" data-t="o_fullm"></option></select></div>
    <div class="row"><label for="debugOn" data-t="s_debug"></label><input id="debugOn" type="checkbox"></div>
    <pre id="debug" hidden></pre>

    <h2 data-t="s_about"></h2>
    <p class="note" data-t="about"></p>
    <p class="note">Anatomy models: BodyParts3D, © The Database Center for Life Science, licensed under CC Attribution-Share Alike 2.1 Japan. Simplified; head and hand models aligned by the author of X-Ray Mirror (MasterOfVFX2070).</p>
  </aside>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const DEMO = location.hash === "#demo";                 // built-in test scene: a standing skeleton, no camera

// Where the libraries and tracker models come from. "?local" takes them from ./vendor, for screens without internet.
const LOCAL = Q.has("local");
const THREE_URL = (DEMO && Q.get("three")) || (LOCAL ? "./vendor/three.module.js" : "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js");
const MP_URL = LOCAL ? "./vendor/tasks-vision" : "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL_DIR = "https://storage.googleapis.com/mediapipe-models/";
const MODELS = { face: "face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                 hand: "hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                 lite: "pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                 full: "pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task" };
const modelUrl = k => LOCAL ? "./vendor/models/" + MODELS[k].split("/").pop() : MODEL_DIR + MODELS[k];

// ------------------------------ words ------------------------------
const TXT = {
  zh: { name: "X 光镜", title: "X 光镜", intro: "站到屏幕前，看看自己的骨架。靠近一点，还能看到头骨、大脑和面部肌肉。", start: "开始",
        privacy: "画面只在这台设备上处理，不会上传。", skeleton: "骨骼", brain: "大脑", muscles: "面部肌肉", lens: "镜片",
        st_idle: "点“开始”打开摄像头", st_cam: "正在打开摄像头…", st_3d: "正在载入人体模型…", st_trk: "正在载入追踪器…",
        st_none: "没有看到人", st_body: "正在跟踪身体", st_head: "正在跟踪头部", st_both: "正在跟踪身体和头部", st_hand: "正在跟踪手", st_demo: "演示场景",
        st_denied: "摄像头被拒绝，请允许后重试", st_fail: "启动失败：", st_err: "追踪出错：",
        hint_step: "站到屏幕前", hint_lens: "举起手，移动镜片", hint_near: "靠近一点，看看头部内部",
        s_screen: "屏幕", s_profile: "屏幕类型", o_auto: "自动", o_p32: "32 寸竖屏", o_p86: "86 寸竖屏", o_desk: "横屏 / 电脑", s_base: "界面中线高度", s_lang: "语言",
        s_full: "全屏显示", b_full: "切换", s_camera: "摄像头", s_device: "设备", s_rotate: "画面旋转", s_mirror: "镜像",
        s_picture: "画面", s_look: "外观", o_xray: "X 光", o_solid: "实体", s_bright: "亮度", s_real: "透出真实画面", s_lens: "镜片大小",
        s_fit: "头部贴合", s_fsize: "大小", s_fy: "上下", s_fz: "前后",
        s_perf: "性能", s_mode: "模式", o_pauto: "自动", o_quality: "最佳画质", o_balanced: "均衡", o_fast: "最快", s_body: "身体追踪", o_lite: "快速", o_fullm: "精确",
        s_debug: "显示追踪数据", s_about: "说明",
        about: "显示的是同一套通用人体模型，按你的身体缩放和摆放。它表示各个结构通常所在的位置，不是对你本人的扫描，也不是医疗工具。",
        soft: "浏览器没有使用显卡，画面会很慢。请在浏览器设置里打开硬件加速。" },
  en: { name: "X-Ray Mirror", title: "X-Ray Mirror", intro: "Step in front of the screen and see your own skeleton. Come closer for the skull, brain and face muscles.", start: "Start",
        privacy: "The picture is processed on this device and never uploaded.", skeleton: "Skeleton", brain: "Brain", muscles: "Face muscles", lens: "Lens",
        st_idle: "Press Start to open the camera", st_cam: "Opening the camera…", st_3d: "Loading the body model…", st_trk: "Loading the trackers…",
        st_none: "Nobody in view", st_body: "Tracking your body", st_head: "Tracking your head", st_both: "Tracking your body and head", st_hand: "Tracking your hand", st_demo: "Demo scene",
        st_denied: "Camera blocked. Allow it and try again", st_fail: "Could not start: ", st_err: "Tracker error: ",
        hint_step: "Step in front of the screen", hint_lens: "Raise a hand to move the lens", hint_near: "Come closer to see inside your head",
        s_screen: "Screen", s_profile: "Screen type", o_auto: "Automatic", o_p32: "32-inch portrait", o_p86: "86-inch portrait", o_desk: "Landscape / desktop", s_base: "UI centre line", s_lang: "Language",
        s_full: "Full screen", b_full: "Toggle", s_camera: "Camera", s_device: "Device", s_rotate: "Rotate picture", s_mirror: "Mirror",
        s_picture: "Picture", s_look: "Look", o_xray: "X-ray", o_solid: "Solid", s_bright: "Brightness", s_real: "Real picture showing through", s_lens: "Lens size",
        s_fit: "Head fit", s_fsize: "Size", s_fy: "Up / down", s_fz: "Forward / back",
        s_perf: "Performance", s_mode: "Mode", o_pauto: "Automatic", o_quality: "Best picture", o_balanced: "Balanced", o_fast: "Fastest", s_body: "Body tracking", o_lite: "Fast", o_fullm: "Accurate",
        s_debug: "Show tracking data", s_about: "About",
        about: "The anatomy is one generic body model, scaled and placed on yours. It shows where structures usually sit. It is not a scan of you and not a medical tool.",
        soft: "This browser is drawing without a graphics card, which is slow. Switch on hardware acceleration in its settings." }
};

// ------------------------------ settings ------------------------------
const DEFAULTS = { lang: (navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en", profile: "auto", uiBase: 58,
                   skeleton: true, brain: false, muscles: false, lens: false, look: "xray", bright: 1, real: 0.18, lensSize: 0.5,
                   rotate: 0, mirror: true, camera: "", perf: "auto", body: "lite", debug: false, fitSize: 1, fitY: 0, fitZ: 0 };
let S = Object.assign({}, DEFAULTS);
try { Object.assign(S, JSON.parse(localStorage.getItem("livex_xray") || "{}")); } catch (e) {}
// one-off set-up through the address: ?screen=86&base=58&lang=zh&rotate=90
if (Q.get("screen")) S.profile = { "32": "p32", "86": "p86", desk: "desk", auto: "auto" }[Q.get("screen")] || S.profile;
if (Q.get("base")) S.uiBase = Math.max(35, Math.min(75, +Q.get("base") || 58));
if (Q.get("lang")) S.lang = Q.get("lang") === "en" ? "en" : "zh";
if (Q.get("rotate")) S.rotate = [0, 90, 180, 270].includes(+Q.get("rotate")) ? +Q.get("rotate") : 0;
const save = () => { try { localStorage.setItem("livex_xray", JSON.stringify(S)); } catch (e) {} };
if (["screen", "base", "lang", "rotate"].some(k => Q.get(k))) save();          // so the address is only needed once
const t = k => (TXT[S.lang] || TXT.en)[k] || k;
const LAYERS = ["skeleton", "brain", "muscles", "lens"];

let stateKey = "st_idle", stateExtra = "", stateCls = "";
let stateShown = "";
function setState(key, cls, extra) {                     // called every frame, so the page is only touched when the words change
  stateKey = key; stateCls = cls || ""; stateExtra = extra || "";
  const sig = S.lang + key + stateCls + stateExtra; if (sig === stateShown) return; stateShown = sig;
  $("state").textContent = t(key) + stateExtra; $("status").className = "status " + stateCls;
}
function applyWords() {
  document.documentElement.lang = S.lang === "zh" ? "zh-CN" : "en";
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  setState(stateKey, stateCls, stateExtra);
}
function profile() { return S.profile !== "auto" ? S.profile : innerHeight >= innerWidth ? "p32" : "desk"; }
function applyProfile() {
  const root = document.documentElement;
  root.dataset.profile = profile(); root.style.setProperty("--base", S.uiBase);
  document.body.classList.toggle("mirror", !!S.mirror);
}
function syncUI() {
  for (const k of LAYERS) document.querySelector('[data-layer="' + k + '"]').setAttribute("aria-pressed", S[k] ? "true" : "false");

    setState("st_cam"); await openCamera();
    $("start").hidden = true;
    stage = "model"; setState("st_3d"); await buildScene(); initHead();
    stage = "trackers"; setState("st_trk"); await loadTrackers();
    $("chips").hidden = false; layout();
    if (perf.software) { $("hint").hidden = false; $("hint").textContent = t("soft"); }
    keepAwake();
    liveLoop();
  } catch (err) {
    started = false; $("go").disabled = false; $("start").hidden = false;
    const denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
    if (denied) setState("st_denied", "warn"); else setState("st_fail", "warn", stage + ": " + (err && err.message ? err.message : err));
  }
}
$("go").onclick = start;
if (DEMO) buildScene().then(() => { initHead(); demoLoop(); }).catch(e => setState("st_fail", "warn", e.message));
else if (Q.has("autostart")) start();
else if (navigator.permissions && navigator.permissions.query) {
  // an unattended screen that was already given the camera starts by itself
  navigator.permissions.query({ name: "camera" }).then(p => { if (p.state === "granted") start(); }).catch(() => {});
}
</script>
</body>
</html>
